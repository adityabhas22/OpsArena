policy_id: kyc_policy
policy_type: compliance
title: Merchant payout KYC policy
version: "1.0"
effective_date: "2026-04-01"
status: active
clauses:
  - clause_id: kyc_require_document
    clause_type: require_info
    description: Payout approval requires a verified identity document.
    mandatory: true
    conditions:
      - field: priority
        operator: gte
        value: 1
    actions:
      - action_type: require_info
        target: individual.verification.document
        reason_code: missing_documentation
  - clause_id: kyc_complete_before_approve
    clause_type: approval_required
    description: Never approve a payout while KYC is incomplete.
    mandatory: true
    conditions:
      - field: priority
        operator: gte
        value: 1
    actions:
      - action_type: defer
        reason_code: awaiting_response
  - clause_id: sanctions_screen_before_release
    clause_type: sanctions
    description: Run sanctions screening before releasing payouts for a merchant under review.
    mandatory: true
    conditions:
      - field: priority
        operator: gte
        value: 1
    actions:
      - action_type: run_sanctions_screen
        reason_code: sanctions_match
  - clause_id: edd_for_owner_anomalies
    clause_type: due_diligence
    description: Start EDD and review beneficial owners when onboarding data is incomplete or higher risk.
    mandatory: true
    conditions:
      - field: priority
        operator: gte
        value: 1
    actions:
      - action_type: start_edd_review
        reason_code: edd_required
      - action_type: review_beneficial_owner
        reason_code: beneficial_owner_mismatch
  - clause_id: ofac_report_for_confirmed_match
    clause_type: reporting
    description: File an OFAC report before closing a confirmed sanctions match.
    mandatory: true
    conditions:
      - field: priority
        operator: gte
        value: 1
    actions:
      - action_type: freeze_payments
        reason_code: sanctions_match
      - action_type: file_ofac_report
        reason_code: reporting_required
